      <path d="M45 -72Q-60 -112 -150 -25"/>
      <path d="M45 -72Q-60 -112 -110 10"/>
    </g>
    <path fill="#cfd9ea" stroke="none" d="M128 -62L152 -76L178 -46L150 -48Z"/>
  </g>
</svg>
